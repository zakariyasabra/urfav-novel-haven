# FAVNOL — Nginx reverse proxy (mobile-performance tuned)
#
# WHY THIS FILE EXISTS
# The Node app is fine (TTFB ~0.45s), but Nginx was shipping /assets/*
# UNCOMPRESSED: styles.css = 169 KB and index.js = 689 KB raw.
# On Lighthouse "Slow 4G" that alone costs ~6s of render-blocking download,
# which is exactly the 8.4s FCP / 10.2s LCP measured on mobile.
# Enabling gzip (and brotli if available) cuts both by ~4-5x.
#
# INSTALL
#   sudo cp deploy/nginx-favnol.conf /etc/nginx/sites-available/favnol.com
#   sudo ln -sf /etc/nginx/sites-available/favnol.com /etc/nginx/sites-enabled/favnol.com
#   sudo nginx -t && sudo systemctl reload nginx
# If you already have SSL managed by certbot, keep your existing server block
# and copy ONLY the `gzip*` lines + the `location ~* ^/assets/` block into it.

server {
  listen 80;
  listen [::]:80;
  server_name favnol.com www.favnol.com;

  # --- Compression (the actual fix) --------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;

  # Serve .gz / .br files produced at build time when they exist.
  gzip_static on;
  # brotli_static on;   # uncomment if libnginx-mod-http-brotli is installed
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types text/css application/javascript application/json image/svg+xml;

  client_max_body_size 20m;

  # --- Hashed build assets: long cache, always compressed ---------------
  location ~* ^/assets/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "gzip";
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # --- App (SSR HTML + API) ---------------------------------------------
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
  }
}
