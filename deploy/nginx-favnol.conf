# FAVNOL — Nginx reverse proxy
#   * ONE canonical host: https://favnol.com   (no www, https only)
#   * mobile-performance tuned (gzip for CSS/JS)
#   * long Arabic / percent-encoded URLs no longer 400
#
# INSTALL
#   sudo cp deploy/nginx-favnol.conf /etc/nginx/sites-available/favnol.com
#   sudo ln -sf /etc/nginx/sites-available/favnol.com /etc/nginx/sites-enabled/favnol.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE (certbot): if certbot manages your server blocks, do NOT replace them.
# Copy instead:
#   1. the two redirect server blocks below (HTTP -> HTTPS, www -> non-www)
#   2. the `gzip*` lines, the `large_client_header_buffers` line and the
#      `location ~* ^/assets/` block into your existing 443 block
#   3. `http2 on;` inside the 443 block (nginx >= 1.25.1)
# Certificates MUST cover both favnol.com and www.favnol.com, otherwise the
# www -> non-www redirect cannot be served over https:
#   sudo certbot --nginx -d favnol.com -d www.favnol.com

# --- Long / UTF-8 encoded URLs -------------------------------------------
# Arabic slugs are percent-encoded, so /novels/<arabic-title>/88 can become a
# 600+ byte request line. nginx's default request buffers (1x 8k) reject
# anything longer with "400 Bad Request" before the app is ever reached.
# These directives must live at http{} level; if you cannot edit nginx.conf,
# the per-server copies below are what nginx actually applies.

# --- 1) HTTP (both hosts) -> HTTPS canonical host -------------------------
server {
  listen 80;
  listen [::]:80;
  server_name favnol.com www.favnol.com;

  # Keep ACME renewals working over plain HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://favnol.com$request_uri;
  }
}

# --- 2) HTTPS www -> HTTPS non-www ---------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.favnol.com;

  # Same certificate as the canonical host (must include www.favnol.com).
  ssl_certificate     /etc/letsencrypt/live/favnol.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/favnol.com/privkey.pem;

  large_client_header_buffers 8 32k;

  return 301 https://favnol.com$request_uri;
}

# --- 3) Canonical host: https://favnol.com -------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name favnol.com;

  ssl_certificate     /etc/letsencrypt/live/favnol.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/favnol.com/privkey.pem;

  # --- 400 Bad Request fix on long Arabic URLs ---------------------------
  large_client_header_buffers 8 32k;
  client_header_buffer_size 8k;
  client_max_body_size 20m;
  # Do not reject unusual but legal characters in the request line.
  ignore_invalid_headers on;

  # --- Compression -------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;

  gzip_static on;
  # brotli_static on;   # if libnginx-mod-http-brotli is installed
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types text/css application/javascript application/json image/svg+xml;

  # --- Hashed build assets: long cache, compressed ----------------------
  location ~* ^/assets/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Ask upstream for plain bytes so nginx can gzip them itself.
    proxy_set_header Accept-Encoding "";
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Vary "Accept-Encoding" always;
  }

  # --- App (SSR HTML + API) ---------------------------------------------
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    # $request_uri keeps the original percent-encoding of Arabic slugs
    # untouched (no double-encoding, no 400).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  favnol.com;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_read_timeout 60s;
  }
}

# --- VERIFY AFTER RELOAD -------------------------------------------------
#   curl -sI https://favnol.com/            | head -1     # 200
#   curl -sI https://www.favnol.com/        | head -3     # 301 -> https://favnol.com/
#   curl -sI http://favnol.com/             | head -3     # 301 -> https://favnol.com/
#   curl -sI http://www.favnol.com/         | head -3     # 301 -> https://favnol.com/
#   curl -s  https://favnol.com/ | grep -i canonical      # https://favnol.com/
#   curl -sI -H 'Accept-Encoding: gzip' https://favnol.com/assets/<file>.css \
#     | grep -i content-encoding                          # gzip
